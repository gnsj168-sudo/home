<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161a;
    --ink-soft: #5c6470;
    --paper: #f7f8fa;
    --card: #ffffff;
    --line: #e3e6eb;
    --accent: #4f46b8;
    --accent-soft: #eeecfb;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--line);
    background: var(--card);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .wordmark {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: auto;
  }

  .wordmark span { color: var(--accent); }

  .modes {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
  }

  .modes button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 7px 14px;
    border: 0;
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
  }

  .modes button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
  }

  .modes button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  .mode-note {
    width: 100%;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px;
  }

  .thread {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .empty {
    color: var(--ink-soft);
    text-align: center;
    padding: 48px 0;
  }

  .empty p { margin: 0 0 6px; }

  .empty .hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }

  .turn { display: flex; flex-direction: column; gap: 6px; }

  .who {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .bubble {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .turn.user .bubble {
    background: var(--accent-soft);
    border-color: transparent;
  }

  .sources {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 7px;
    background: var(--card);
  }

  .thinking .bubble { color: var(--ink-soft); }

  .dots::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dots::after { animation: none; content: '...'; }
  }

  footer {
    border-top: 1px solid var(--line);
    background: var(--card);
    padding: 14px 20px;
  }

  form {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    color: inherit;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--paper);
    max-height: 160px;
  }

  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: transparent;
  }

  button.send {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 12px 18px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }

  button.send:disabled {
    background: var(--line);
    color: var(--ink-soft);
    cursor: not-allowed;
  }

  button.send:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">Home<span>.</span></div>
  <div class="modes" role="group" aria-label="Answering mode">
    <button type="button" id="mode-chat" aria-pressed="true">agent</button>
    <button type="button" id="mode-ask" aria-pressed="false">retrieval</button>
  </div>
  <div class="mode-note" id="mode-note">Agent mode: chooses its own tools and remembers the conversation.</div>
</header>

<main>
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <p>Ask about anything in your notes.</p>
      <p class="hint">what were my HTNet results?</p>
    </div>
  </div>
</main>

<footer>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Ask a question…" autocomplete="off"></textarea>
    <button type="submit" class="send" id="send">Send</button>
  </form>
</footer>

<script>
  const thread = document.getElementById('thread');
  const empty = document.getElementById('empty');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const modeNote = document.getElementById('mode-note');
  const btnChat = document.getElementById('mode-chat');
  const btnAsk = document.getElementById('mode-ask');

  const conversationId = 'web-' + Math.random().toString(36).slice(2, 10);
  let mode = 'chat';

  const NOTES = {
    chat: 'Agent mode: chooses its own tools and remembers the conversation.',
    ask: 'Retrieval mode: one search, one answer, no memory between questions.'
  };

  function setMode(next) {
    mode = next;
    btnChat.setAttribute('aria-pressed', String(next === 'chat'));
    btnAsk.setAttribute('aria-pressed', String(next === 'ask'));
    modeNote.textContent = NOTES[next];
  }

  btnChat.addEventListener('click', () => setMode('chat'));
  btnAsk.addEventListener('click', () => setMode('ask'));

  function addTurn(who, text, cls) {
    empty.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'turn ' + (cls || '');
    const label = document.createElement('div');
    label.className = 'who';
    label.textContent = who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.append(label, bubble);
    thread.append(wrap);
    wrap.scrollIntoView({ block: 'end' });
    return { wrap, bubble };
  }

  function addSources(wrap, sources) {
    if (!sources || !sources.length) return;
    const row = document.createElement('div');
    row.className = 'sources';
    for (const s of sources) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = 'chunk ' + s.id;
      row.append(chip);
    }
    wrap.append(row);
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('composer').requestSubmit();
    }
  });

  document.getElementById('composer').addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addTurn('you', question, 'user');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const pending = addTurn('home', '', 'thinking');
    pending.bubble.innerHTML = '<span class="dots">working</span>';

    const url = mode === 'chat' ? '/chat' : '/ask';
    const body = mode === 'chat'
      ? { message: question, conversation_id: conversationId }
      : { question };

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        pending.wrap.className = 'turn';
        pending.bubble.textContent =
          'The server returned ' + res.status + '. Check the uvicorn terminal for details.';
        return;
      }

      const data = await res.json();
      pending.wrap.className = 'turn';
      pending.bubble.textContent = data.answer;
      addSources(pending.wrap, data.sources);
    } catch (err) {
      pending.wrap.className = 'turn';
      pending.bubble.textContent = 'Could not reach the server. Is uvicorn still running?';
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.focus();
</script>

</body>
</html>
